<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111114">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>INFLORÉ ’27 | Personal Invite</title>

  <style>
    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      background: #0c0c0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      padding: max(22px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    }

    .card {
      margin-top: 10px;
      padding: 28px 21px 24px;
      border: 1px solid #303035;
      border-radius: 26px;
      background: #17171a;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    .brand {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #aaaab0;
      line-height: 1.4;
    }

    h1 {
      margin: 13px 0 2px;
      font-size: clamp(40px, 13vw, 52px);
      line-height: 1;
      letter-spacing: -2.5px;
    }

    .tagline {
      margin: 0 0 25px;
      color: #c8c8ce;
      font-size: 16px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      color: #aaaab0;
      font-size: 12px;
    }

    input {
      display: block;
      width: 100%;
      min-height: 50px;
      padding: 13px 14px;
      border: 1px solid #3b3b42;
      border-radius: 12px;
      outline: none;
      background: #101013;
      color: #fff;
      font: inherit;
      font-size: 16px; /* prevents iOS Safari zoom */
      -webkit-appearance: none;
      appearance: none;
    }

    input:focus {
      border-color: #77777f;
    }

    .phone {
      display: flex;
      gap: 8px;
    }

    .country {
      width: 78px;
      flex: 0 0 78px;
    }

    .number {
      flex: 1;
    }

    .consent {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 17px;
      color: #aaaab0;
      font-size: 12px;
      line-height: 1.45;
    }

    .consent input {
      width: 18px;
      height: 18px;
      min-height: 18px;
      margin: 1px 0 0;
      padding: 0;
      flex: 0 0 18px;
      -webkit-appearance: checkbox;
      appearance: checkbox;
    }

    button, .link {
      display: flex;
      width: 100%;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 13px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      border: 0;
      background: #25d366;
      color: #071b0d;
    }

    button:disabled {
      opacity: .42;
      cursor: not-allowed;
    }

    .link {
      margin-top: 10px;
      border: 1px solid #44444b;
      background: #202024;
      color: #fff;
    }

    .preview {
      margin-top: 20px;
      padding: 14px;
      border: 1px solid #303035;
      border-radius: 14px;
      background: #111114;
    }

    .preview-title {
      color: #77777f;
      font-size: 10px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    #preview {
      margin: 9px 0 0;
      color: #ccccd2;
      white-space: pre-wrap;
      font-size: 12px;
      line-height: 1.5;
    }

    .note {
      margin: 15px 4px 0;
      color: #77777f;
      font-size: 11px;
      line-height: 1.45;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card">
      <div class="brand">Rajagiri Centre for Business Studies</div>

      <h1>INFLORÉ ’27</h1>
      <p class="tagline">A personal invitation.</p>

      <label for="name">Name</label>
      <input id="name" type="text" placeholder="e.g. Rahul"
             autocomplete="name" autocapitalize="words">

      <label for="number">WhatsApp number</label>
      <div class="phone">
        <input id="country" class="country" type="tel" value="+91"
               inputmode="tel" aria-label="Country code">
        <input id="number" class="number" type="tel" placeholder="9876543210"
               inputmode="numeric" autocomplete="tel">
      </div>

      <label for="college">College</label>
      <input id="college" type="text" placeholder="e.g. ABC College"
             autocomplete="organization" autocapitalize="words">

      <label class="consent">
        <input id="consent" type="checkbox">
        <span>I agree to receive Infloré ’27 invitations and updates on WhatsApp.</span>
      </label>

      <button id="send" type="button" disabled>
        SEND PERSONALIZED INVITE
      </button>

      <a class="link" href="https://inflore.rajagiri.edu/" target="_blank" rel="noopener">
        OPEN INFLORÉ WEBSITE
      </a>

      <a class="link" href="https://www.instagram.com/inflore.27/" target="_blank" rel="noopener">
        FOLLOW @INFLORÉ.27
      </a>

      <div class="preview">
        <div class="preview-title">Message preview</div>
        <p id="preview"></p>
      </div>

      <div class="note">
        This version is designed to run as a normal HTTPS webpage on GitHub Pages.
        Database connection can be added later.
      </div>
    </section>
  </main>

  <script>
    (function () {
      const nameInput = document.getElementById("name");
      const countryInput = document.getElementById("country");
      const numberInput = document.getElementById("number");
      const collegeInput = document.getElementById("college");
      const consentInput = document.getElementById("consent");
      const sendButton = document.getElementById("send");
      const preview = document.getElementById("preview");

      /* =========================================================
         EASY MESSAGE EDIT AREA
         Change the text below whenever you want to change
         the WhatsApp invitation.
         ========================================================= */

      function createMessage() {
        const name = nameInput.value.trim() || "there";

        return `Hey ${name}! 👋

You’ve been personally invited to INFLORÉ ’27 by Rajagiri Centre for Business Studies.

We’re bringing fresh challenges, competitions and experiences this year. Would love to have you and your team join us!

Discover more: https://inflore.rajagiri.edu/
Instagram: @inflore.27`;
      }

      function updatePage() {
        preview.textContent = createMessage();

        const validName = nameInput.value.trim().length > 0;
        const validNumber = numberInput.value.replace(/\D/g, "").length >= 7;
        const validCollege = collegeInput.value.trim().length > 0;
        const consentGiven = consentInput.checked;

        sendButton.disabled = !(validName && validNumber && validCollege && consentGiven);
      }

      [nameInput, countryInput, numberInput, collegeInput].forEach(function (element) {
        element.addEventListener("input", updatePage);
      });

      consentInput.addEventListener("change", updatePage);

      sendButton.addEventListener("click", function () {
        const country = countryInput.value.replace(/\D/g, "") || "91";
        const number = numberInput.value.replace(/\D/g, "");

        if (number.length < 7) return;

        const fullNumber = country + number;
        const whatsappURL =
          "https://wa.me/" +
          fullNumber +
          "?text=" +
          encodeURIComponent(createMessage());

        /*
          location.href is intentionally used instead of window.open().
          This is more reliable on iPhone Safari because the navigation
          happens directly from the user's tap.
        */
        window.location.href = whatsappURL;
      });

      updatePage();
    })();
  </script>
</body>
</html>
